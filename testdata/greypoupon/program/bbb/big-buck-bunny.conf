# The actual video we want to play
video="bbb_sunflower_1080p_30fps_normal.mp4"

# A list of country-specific ratings (Philippine and US ratings are used here)
# which loads up the 
ratings=["ph_pg","us_tv-g"]

# Places where bumpers can be added
breaks = [
    # The timestamp in HH:MM:SS:FF format
    # Whether to show the program's title card
    # Whether to show a "You're watching" bumper
    {timestamp = "00:03:40:24", show-title-card = false, show-youre-watching = true}
    {timestamp = "00:05:16:00", show-title-card = false, show-youre-watching = true}
]

break-title-card="bbb-titlecard.mp4"
# Set this to "<use-builtin>" you prefer using a program's builtin "You're Watching" bumper
break-youre-watching="bbb-yourewatching.mp4"