# Note that (as of now) we only support streaming over HLS (mainly) and RTMP. While this will support the latter,
# you're better off using HLS as it supports basically any codec that can support being stuffed into an 
# MP(R)EG-TS or MP4 container.
# (probably, I tested HLS using a WebM video (obviously containing VP9/Opus) and it worked flawlessly. FFmpeg,
# Nginx+nginx-rtmp-module and VLC in case you were asking about how)
# WRONG!!??? The Wikipedia page about HLS says the video is reencoded to H.264/AAC but from my previously
# stated testing it was able to work file when I add a `-c copy` to FFmpeg, normally this errors out when
# using RTMP (only supports H.264/AAC at 44.1kHz) but works fine under HLS. Huh??
# I haven't checked- you know what this may as well be an issue ticket, I'm just gonna continue there.
streamurl="rtmp://a.rtmp.youtube.com/live2/"

# Since this is purpose-built for Youtube, it uses way of storing the stream key
# The stream key lives on it's own file so that this config can be shared around without
# revealing the stream key
streamkey="streamkey.env"

# If in the near future we support other services we put it here
# For now it's only either "youtube" or "rtmp-only"
service-spec="youtube"

# Points to a configuration file containing the program to be streamed
program="/media/greypoupon/program/program.conf"

# Points to a configuration file containing any assets the program may use
# like channel logos (bugs), content ratings (if you want the real experience)
# mostly stuff that is reused for each program
assets="/media/greypoupon/assets/assets.conf"

# [optional] A file which outputs both this program and Gin's logs (recommended)
logfile="/mnt/d/temp/log.txt"

# [optional] At what time will the "broadcast" start at, displaying a graphic in the meanitime
# This can be in any format as long as Go's time.Parse can read it
start="2029-06-24T12:30:00Z"