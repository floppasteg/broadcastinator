<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>console - broadcastinator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
    <script src="masterctl.js"></script>
    <meta name="viewport" content="minimal-ui, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
</head>

<body>
    <script>
        document.body.onload = function () {
            masterctlHold(document.getElementById('start'), 'start', 2000)
            masterctlHold(document.getElementById('override'), 'override', 2000)
            masterctlHold(document.getElementById('shutdown-soft'), 'shutdown-soft', 2000)
            masterctlHold(document.getElementById('shutdown-hard'), 'shutdown-hard', 2000)
            masterctlHold(document.getElementById('e-stop'), 'e-stop', 5000)
        }
    </script>
    <div id="status" style="background-color: gray; padding: 15px 32px; ">Unknown (note: if you are seeing this, you
        probably just opened the HTML file without starting the server)</div>
    <div id="log1-container"></div>
    <div style="position: relative;">
        <button id="log1-clear" onclick="clearLog()">Clear log</button>
        <button id="log1-restore" onclick="restoreLog()">Restore log</button>
        <button id="log1-follow" onclick="followLog()">Follow</button>
    </div>
    <footer class="master-control-panel center">
        <p style="margin-right: 3em;">Master controls(hold for 2s)</p>
        <button class="master-control-buttons" id="start" style="background-color:green">Start</button>
        <button class="master-control-buttons" id="override" style="background-color: yellow;">Override</button>
        <button class="master-control-buttons" id="shutdown-soft" style="background-color: orange;">Shutdown
            (soft)</button>
        <button class="master-control-buttons" id="shutdown-hard" style="background-color: orange;">Shutdown
            (hard)</button>
        <button class="master-control-buttons" id="e-stop" style="background-color: red;">Emergency Stop (hold for
            5s)</button>
    </footer>
    <script>
        document.body.onload = function () {
            if (environ() == "online") {
                let req = new XMLHttpRequest()
                req.open("GET", "http://" + location.hostname + ":8088/conn")
                req.addEventListener('error', function () {
                    console.error("could not send master command")
                    changeStatus("disconnected", "cannot see connection test, see F12 console for details")
                })
                req.addEventListener('load', function () {
                    let obj = JSON.parse(this.responseText)
                    if (obj.status != 'success') {
                        console.error("connTest.status != success, details: ", obj)
                    }
                    changeStatus("connected-inactive", "")
                })
                req.send()
            }
        }
    </script>
</body>

</html>
